# Ядро тренажёра оператора ДДС-112.
# Запуск: docker compose up -d --build
# Профили: ai (локальные модели), telephony (Asterisk); live, monitoring — в следующих волнах.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
  TZ: ${TZ:-Europe/Moscow}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан, см. .env.example}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL не задан, см. .env.example}
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL не задан, см. .env.example}
  APP_DB_USER: ${APP_DB_USER:-trainer_app}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SEED_PASSWORD: ${SEED_PASSWORD:-Demo12345}
  LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATA_DIR: /data
  STORAGE_DIR: /storage
  MODELS_DIR: /models
  # Backups (wave 9): the folder shared with the backup service and the schedule defaults.
  BACKUP_DIR: /backups
  BACKUP_TIME: ${BACKUP_TIME:-03:00}
  BACKUP_KEEP: ${BACKUP_KEEP:-14}
  ANALYTICS_DIR: /ai
  EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/models/embeddings/multilingual-e5-small}
  DIALOG_MODE: ${DIALOG_MODE:-select}
  LLM_DIALOG_URL: ${LLM_DIALOG_URL:-http://llm-dialog:8080}
  LLM_GEN_URL: ${LLM_GEN_URL:-http://llm-gen:8080}
  STT_URL: ${STT_URL:-http://stt:9000}
  VAD_MODEL_PATH: /models/vad/silero_vad.onnx
  # Telephony (profile telephony): ARI of Asterisk, the folder of generated endpoints and
  # where Asterisk sends the operator's audio (the backend by its service name).
  TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
  ARI_URL: http://asterisk:8088/ari
  ARI_USER: trainer
  ARI_PASSWORD: ${ARI_PASSWORD:-trainer}
  ASTERISK_CONFIG_DIR: /asterisk
  TELEPHONY_MEDIA_HOST: backend

services:
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TLS_HOSTS: ${TLS_HOSTS:-localhost,127.0.0.1}
      # Domain with a Let's Encrypt certificate (README, «Публичный сертификат»); empty = only the
      # internal certificate above.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    volumes:
      - certs:/etc/nginx/certs
      - letsencrypt:/etc/nginx/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - storage:/storage
      - asterisk-conf:/asterisk
      - backups:/backups
      - ./data:/data:ro
      - ./ai:/ai:ro
      - ${MODELS_DIR:-./models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *backend-env
    volumes:
      - storage:/storage
      - ./data:/data:ro
      - ${MODELS_DIR:-./models}:/models:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, см. .env.example}
      APP_DB_USER: ${APP_DB_USER:-trainer_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD не задан, см. .env.example}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # Exposed for local tests and tools; not needed by the containers themselves.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  languagetool:
    image: erikvl87/languagetool:6.5
    restart: unless-stopped
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8010/v2/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backup:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-trainer}
      PGUSER: ${POSTGRES_USER:-trainer}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, см. .env.example}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-alive && find /tmp/backup-alive -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------- Профиль ai: локальные модели на CPU ----------
  # Модели скачиваются один раз: scripts/fetch_models.sh (папка MODELS_DIR, по умолчанию ./models).
  # Без профиля ядро работает: диалог в режиме buttons, реплики текстом, ввод оператора текстом.
  llm-dialog:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["ai"]
    restart: unless-stopped
    command:
      - -m
      - /models/llm/${LLM_DIALOG_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -c
      - "${LLM_DIALOG_CTX:-8192}"
      - -np
      - "${LLM_DIALOG_SLOTS:-4}"
      - -t
      - "${LLM_THREADS:-4}"
      - --jinja
      - --no-webui
      - --load-mode
      - ${LLM_LOAD_MODE:-auto}
    ports:
      # Exposed for scripts/bench_dialog_latency.py run from the host.
      - "${LLM_DIALOG_PORT:-8081}:8080"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  llm-gen:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["ai"]
    restart: unless-stopped
    command:
      - -m
      - /models/llm/${LLM_GEN_MODEL:-qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -c
      - "${LLM_GEN_CTX:-8192}"
      - -np
      - "1"
      - -t
      - "${LLM_THREADS:-4}"
      - --jinja
      - --no-webui
      - --load-mode
      - ${LLM_LOAD_MODE:-auto}
    ports:
      - "${LLM_GEN_PORT:-8082}:8080"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  stt:
    build:
      context: ./deploy/stt
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      STT_MODEL_DIR: /models/stt/${STT_MODEL:-faster-whisper-base}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_THREADS: ${LLM_THREADS:-4}
    ports:
      - "${STT_PORT:-9000}:9000"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro

  # ---------- Профиль telephony: Asterisk (PJSIP, WebRTC, ARI) ----------
  # Софтфон в браузере ходит через nginx (wss://<хост>/ws/sip), настольные телефоны — на
  # порт SIP_PORT (udp/tcp). Звук идёт напрямую на порты RTP, поэтому они опубликованы;
  # на Docker Desktop нужен TELEPHONY_EXTERNAL_IP (адрес машины), см. .env.example.
  asterisk:
    build:
      context: ./deploy/asterisk
    profiles: ["telephony"]
    restart: unless-stopped
    # The host name goes into SIP Contact headers of WebSocket calls; the random container id
    # (all hex digits) is not a valid host name for the browser softphone.
    hostname: asterisk
    environment:
      ARI_PASSWORD: ${ARI_PASSWORD:-trainer}
      TELEPHONY_EXTERNAL_IP: ${TELEPHONY_EXTERNAL_IP:-}
      TELEPHONY_LOCAL_NET: ${TELEPHONY_LOCAL_NET:-172.16.0.0/12}
      TELEPHONY_RTP_START: ${TELEPHONY_RTP_START:-10000}
      TELEPHONY_RTP_END: ${TELEPHONY_RTP_END:-10100}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_PORT:-5060}:5060/tcp"
      # ARI on the host only for scripts/bench_call.py; the backend uses the internal address.
      - "${ARI_PORT:-8088}:8088"
      - "${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10100}:${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10100}/udp"
    volumes:
      - asterisk-conf:/etc/asterisk/generated
      # Recordings land in storage/recordings; voiced replies are played from storage/tts.
      - storage:/var/spool/asterisk/recording
      - storage:/var/lib/asterisk/sounds/trainer:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------- Профили следующих волн (объявлены, пока пустые) ----------
  # live: vLLM, потоковые STT/TTS, VAD — трек G.
  # monitoring: Prometheus, Grafana — фаза E.
  profiles-placeholder:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'Профили live, monitoring будут заполнены в следующих волнах'"]
    profiles: ["live", "monitoring"]

volumes:
  pgdata:
  redisdata:
  storage:
  backups:
  certs:
  asterisk-conf:
  # Let's Encrypt certificate of PUBLIC_HOST and the webroot of its challenges.
  letsencrypt:
  certbot-www:
