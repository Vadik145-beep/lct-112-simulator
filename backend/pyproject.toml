[project]
name = "dds112-trainer-backend"
version = "0.1.0"
description = "Бэкенд тренажёра оператора ДДС-112"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.14.6",
    "piper-tts>=1.8",
    "torch>=2.5",
    "num2words>=0.5.13",
    "tokenizers>=0.21",
    "onnxruntime>=1.20",
    "cryptography>=43.0",
    "websockets>=13.0",
    "numpy>=1.26",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# One-off dataset preparation on a developer machine (OCR of the ticket scans).
dataset = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "numpy>=1.26",
    "shapely>=2.0",
]

[tool.uv]
package = false

# torch only from the CPU wheels: the server has no GPU and the CUDA build is ~2 GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W", "RUF"]
ignore = ["S101", "S104", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Test ids contain Russian text (streets, statuses): show it as is.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
pythonpath = ["."]
