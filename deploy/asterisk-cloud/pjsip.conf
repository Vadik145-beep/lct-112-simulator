; PJSIP of the cloud voice Asterisk (plan/track-c-vapi.md).
;
; The same templates and generated files as deploy/asterisk/pjsip.conf (the backend writes
; the trainees' endpoints into generated/endpoints.conf), plus the trunk to Vapi rendered
; into generated/trunk.conf from VAPI_SIP_HOST. Vapi takes inbound SIP without registration
; but challenges the INVITE: the credentials are generated/vapi-auth.conf, written by the
; backend (app.telephony.sip.write_vapi_auth). The caller number of our leg carries the call
; token.

[global]
type = global
user_agent = DDS-112 Trainer
endpoint_identifier_order = username,ip,anonymous
default_realm = trainer

[system]
type = system
timer_t1 = 500
timer_b = 32000

#include generated/transports.conf

; ---------- templates ----------

[webrtc-endpoint](!)
type = endpoint
context = trainer-in
webrtc = yes
dtls_auto_generate_cert = yes
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
language = ru
send_pai = yes
trust_id_outbound = yes

[webrtc-auth](!)
type = auth
auth_type = userpass

[webrtc-aor](!)
type = aor
max_contacts = 3
remove_existing = yes
qualify_frequency = 0

[phone-endpoint](!)
type = endpoint
context = trainer-in
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
language = ru
send_pai = yes
trust_id_outbound = yes
dtmf_mode = rfc4733

[phone-auth](!)
type = auth
auth_type = userpass

[phone-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

#include generated/endpoints.conf
#include generated/vapi-auth.conf
#include generated/trunk.conf
#include generated/multifon.conf
