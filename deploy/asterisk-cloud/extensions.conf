; Dialplan of the cloud voice Asterisk (plan/track-c-vapi.md): the trainee is rung as in
; deploy/asterisk/extensions.conf; the caller is a second leg to Vapi that the backend
; bridges with the trainee through ARI.
[general]
static = yes
writeprotect = no
clearglobalvars = no

; Outgoing calls of the backend to the trainee: Local/s@trainer-out with the channel variables
; STU_LOGIN, ATTEMPT_ID, RING_TIMEOUT, CALLER_NAME and CALLER_NUM set through ARI.
[trainer-out]
exten => s,1,NoOp(Trainer: calling ${STU_LOGIN} for attempt ${ATTEMPT_ID})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,ExecIf($[${LEN(${CALLER_NUM})} > 0]?Set(CALLERID(num)=${CALLER_NUM}))
 same => n,ExecIf($[${LEN(${CALLER_NAME})} > 0]?Set(CALLERID(name)=${CALLER_NAME}))
 same => n,GotoIf($["${DEVICE_STATE(Stasis:bench-${STU_LOGIN})}" = "INUSE"]?bench)
 same => n,Dial(PJSIP/stu-${STU_LOGIN}&PJSIP/phone-${STU_LOGIN},${RING},b(trainer-predial^s^1))
 same => n,Hangup()
 same => n(bench),Stasis(bench,${STU_LOGIN},${ATTEMPT_ID})
 same => n,Hangup()

[trainer-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n,Return()

; The caller's leg: Local/s@vapi-out with CALL_TOKEN (becomes the caller number Vapi reports
; as customer.number), VAPI_USER (user part of the trainer's SIP number in Vapi) and
; ATTEMPT_ID, all set through ARI. The endpoint «vapi» is generated/trunk.conf.
[vapi-out]
exten => s,1,NoOp(Trainer: cloud caller for attempt ${ATTEMPT_ID}, token ${CALL_TOKEN})
 same => n,Set(CALLERID(num)=${CALL_TOKEN})
 same => n,Set(CALLERID(name)=${CALL_TOKEN})
 same => n,Dial(PJSIP/${VAPI_USER}@vapi,30,b(vapi-predial^s^1))
 same => n,Hangup()

; Custom headers on the INVITE to Vapi (x-* headers become template variables there).
[vapi-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Call-Token)=${CALL_TOKEN})
 same => n,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n,Return()

; Vapi never calls us first; anything that still arrives on the trunk is refused.
[vapi-in]
exten => _X.,1,NoOp(Trainer: unexpected call from the trunk)
 same => n,Hangup()
exten => s,1,Hangup()

; Calls made from a softphone or a desk phone: 100 is an echo test to check the headset.
[trainer-in]
exten => 100,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _X.,1,NoOp(Trainer: outgoing calls from phones are not allowed)
 same => n,Congestion()
 same => n,Hangup()
