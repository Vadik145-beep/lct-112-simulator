; PJSIP of the trainer (PRD 9.5).
;
; Transports are rendered from the environment (generated/transports.conf): ws for the browser
; softphone behind nginx, udp and tcp for desk IP phones. The endpoints of trainees are written
; by the backend into generated/endpoints.conf from the templates below:
;   stu-<login>   browser softphone: WebRTC (DTLS-SRTP, ICE, Opus)
;   phone-<login> desk IP phone: G.722 / PCMA over UDP or TCP

[global]
type = global
user_agent = DDS-112 Trainer
endpoint_identifier_order = username,ip,anonymous
default_realm = trainer

[system]
type = system
timer_t1 = 500
timer_b = 32000

#include generated/transports.conf

; ---------- templates ----------

[webrtc-endpoint](!)
type = endpoint
context = trainer-in
webrtc = yes
dtls_auto_generate_cert = yes
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
language = ru
send_pai = yes
trust_id_outbound = yes

[webrtc-auth](!)
type = auth
auth_type = userpass

[webrtc-aor](!)
type = aor
max_contacts = 3
remove_existing = yes
qualify_frequency = 0

[phone-endpoint](!)
type = endpoint
context = trainer-in
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
language = ru
send_pai = yes
trust_id_outbound = yes
dtmf_mode = rfc4733

[phone-auth](!)
type = auth
auth_type = userpass

[phone-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

#include generated/endpoints.conf
#include generated/trunk.conf
