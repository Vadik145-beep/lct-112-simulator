; Dialplan of the trainer (PRD 9.5).
[general]
static = yes
writeprotect = no
clearglobalvars = no

; Outgoing calls of the backend: Local/s@trainer-out with the channel variables
; STU_LOGIN (login of the trainee), ATTEMPT_ID, RING_TIMEOUT, CALLER_NAME and CALLER_NUM set through ARI.
; The softphone and the desk phone of the trainee ring together; whichever answers first
; takes the call. A bench phone (scripts/bench_call.py) claims a login by setting the
; device state Stasis:bench-<login> to INUSE: its calls go to the Stasis app «bench».
[trainer-out]
exten => s,1,NoOp(Trainer: calling ${STU_LOGIN} for attempt ${ATTEMPT_ID})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,ExecIf($[${LEN(${CALLER_NUM})} > 0]?Set(CALLERID(num)=${CALLER_NUM}))
 same => n,ExecIf($[${LEN(${CALLER_NAME})} > 0]?Set(CALLERID(name)=${CALLER_NAME}))
 same => n,GotoIf($["${DEVICE_STATE(Stasis:bench-${STU_LOGIN})}" = "INUSE"]?bench)
 same => n,Dial(PJSIP/stu-${STU_LOGIN}&PJSIP/phone-${STU_LOGIN},${RING},b(trainer-predial^s^1))
 same => n,Hangup()
 same => n(bench),Stasis(bench,${STU_LOGIN},${ATTEMPT_ID})
 same => n,Hangup()

; Runs on the called channel before the INVITE: the softphone reads the attempt from the
; header X-Attempt-Id.
[trainer-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n,Return()

; A dispatcher's call to a service officer (issue #36): the backend originates
; Local/s@service-out with SERVICE_CALL_ID, the officer's name and number as the caller id; the
; trainee's phones ring and the softphone answers at once (header X-Service-Call), then the
; officer, played by the backend, greets in the bridge.
[service-out]
exten => s,1,NoOp(Trainer: service call ${SERVICE_CALL_ID} to ${STU_LOGIN} for attempt ${ATTEMPT_ID})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,ExecIf($[${LEN(${CALLER_NUM})} > 0]?Set(CALLERID(num)=${CALLER_NUM}))
 same => n,ExecIf($[${LEN(${CALLER_NAME})} > 0]?Set(CALLERID(name)=${CALLER_NAME}))
 same => n,Dial(PJSIP/stu-${STU_LOGIN}&PJSIP/phone-${STU_LOGIN},${RING},b(service-predial^s^1))
 same => n,Hangup()

[service-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n,Set(PJSIP_HEADER(add,X-Service-Call)=${SERVICE_CALL_ID})
 same => n,Return()

; Calls made from a softphone or a desk phone: 100 is an echo test to check the headset.
[trainer-in]
exten => 100,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _X.,1,NoOp(Trainer: outgoing calls from phones are not allowed)
 same => n,Congestion()
 same => n,Hangup()
