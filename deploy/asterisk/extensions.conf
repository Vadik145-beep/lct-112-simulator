; Dialplan of the trainer (PRD 9.5).
[general]
static = yes
writeprotect = no
clearglobalvars = no

#include generated/globals.conf

; Outgoing calls of the backend: Local/s@trainer-out with the channel variables
; STU_LOGIN (login of the trainee), ATTEMPT_ID, RING_TIMEOUT, CALLER_NAME, CALLER_NUM and MOBILE
; set through ARI. The softphone, the desk phone and, with the trunk on, the trainee's own phone
; (MOBILE, trainee-targets) ring together; whichever answers first takes the call. A bench phone (scripts/bench_call.py) claims a login by setting the
; device state Stasis:bench-<login> to INUSE: its calls go to the Stasis app «bench».
[trainer-out]
exten => s,1,NoOp(Trainer: calling ${STU_LOGIN} for attempt ${ATTEMPT_ID})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,ExecIf($[${LEN(${CALLER_NUM})} > 0]?Set(CALLERID(num)=${CALLER_NUM}))
 same => n,ExecIf($[${LEN(${CALLER_NAME})} > 0]?Set(CALLERID(name)=${CALLER_NAME}))
 same => n,GotoIf($["${DEVICE_STATE(Stasis:bench-${STU_LOGIN})}" = "INUSE"]?bench)
 same => n,Gosub(trainee-targets,s,1)
 same => n,Dial(${TARGETS},${RING},b(trainer-predial^s^1))
 same => n,Hangup()
 same => n(bench),Stasis(bench,${STU_LOGIN},${ATTEMPT_ID})
 same => n,Hangup()

; Runs on the called channel before the INVITE: the softphone reads the attempt from the
; header X-Attempt-Id.
[trainer-predial]
exten => s,1,GotoIf($["${CHANNEL(endpoint)}" = "trunk"]?done)
 same => n,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n(done),Return()

; A dispatcher's call to a service officer (issue #36) and a squad's report to the dispatcher
; (issue #103): the backend originates Local/s@service-out with SERVICE_CALL_ID, the officer's
; name and number as the caller id. The trainee's phones ring; the softphone answers a call the
; dispatcher started by itself and lets the trainee answer a report (SERVICE_CALL_KIND in the
; header X-Service-Call-Kind). After the answer the officer, played by the backend, speaks in
; the bridge.
[service-out]
exten => s,1,NoOp(Trainer: service call ${SERVICE_CALL_ID} to ${STU_LOGIN} for attempt ${ATTEMPT_ID})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,ExecIf($[${LEN(${CALLER_NUM})} > 0]?Set(CALLERID(num)=${CALLER_NUM}))
 same => n,ExecIf($[${LEN(${CALLER_NAME})} > 0]?Set(CALLERID(name)=${CALLER_NAME}))
 same => n,Gosub(trainee-targets,s,1)
 same => n,Dial(${TARGETS},${RING},b(service-predial^s^1))
 same => n,Hangup()

[service-predial]
exten => s,1,GotoIf($["${CHANNEL(endpoint)}" = "trunk"]?done)
 same => n,Set(PJSIP_HEADER(add,X-Attempt-Id)=${ATTEMPT_ID})
 same => n,Set(PJSIP_HEADER(add,X-Service-Call)=${SERVICE_CALL_ID})
 same => n,Set(PJSIP_HEADER(add,X-Service-Call-Kind)=${SERVICE_CALL_KIND})
 same => n(done),Return()

; TARGETS: the softphone, the desk phone and, when the trunk is on and the backend passed the
; trainee's own phone (a lesson with calls to the phone, issue #234), that phone through the
; trunk. The operator shows the number of the line, not the scenario's one.
[trainee-targets]
exten => s,1,Set(TARGETS=PJSIP/stu-${STU_LOGIN}&PJSIP/phone-${STU_LOGIN})
 same => n,ExecIf($[${LEN(${GLOBAL(TRUNK_ON)})} > 0 & ${LEN(${MOBILE})} > 0]?Set(TARGETS=${TARGETS}&PJSIP/${MOBILE}@trunk))
 same => n,Return()

; Входящие с внешнего транка (опция, issue #39, #234). Если задан TELEPHONY_TRUNK_INBOUND,
; звонок идёт на телефоны этого обучающегося. Иначе бэкенд ищет обучающегося по номеру
; звонящего и отдаёт ему вызов занятия, который сейчас для него звонит (112, служба, доклад,
; обратный звонок). Ничего не звонит или номер незнаком: бэкенд сбрасывает звонок.
[trunk-in]
exten => _[+0-9].,1,NoOp(Trunk: incoming call from ${CALLERID(num)})
 same => n,GotoIf($[${LEN(${TRUNK_INBOUND})} > 0]?to-trainee)
 same => n,Stasis(trainer,inbound,${CALLERID(num)})
 same => n,Hangup()
 same => n(to-trainee),Dial(PJSIP/stu-${TRUNK_INBOUND}&PJSIP/phone-${TRUNK_INBOUND},45)
 same => n,Hangup()
exten => s,1,Goto(_[+0-9].,1)

; Исходящие через внешний транк: Local/<номер>@trunk-out из ARI или из плана набора.
[trunk-out]
exten => _[+0-9].,1,NoOp(Trunk: outgoing call to ${EXTEN})
 same => n,Set(RING=${IF($[${LEN(${RING_TIMEOUT})} > 0]?${RING_TIMEOUT}:45)})
 same => n,Dial(PJSIP/${EXTEN}@trunk,${RING})
 same => n,Hangup()

; Calls made from a softphone or a desk phone: 100 is an echo test to check the headset.
[trainer-in]
exten => 100,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _X.,1,NoOp(Trainer: outgoing calls from phones are not allowed)
 same => n,Congestion()
 same => n,Hangup()
