# Routes of the trainer, shared by every HTTPS server block (default.conf, public.conf).
include /etc/nginx/security-headers.conf;

root /usr/share/nginx/html;
index index.html;

location = /health {
    proxy_pass http://backend/api/health;
    proxy_set_header Host $host;
}

location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

# SIP over WebSocket of the browser softphone → Asterisk (resolved at request time, so nginx
# starts without the telephony profile).
location = /ws/sip {
    resolver 127.0.0.11 valid=10s;
    set $asterisk http://asterisk:8088;
    proxy_pass $asterisk/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

location /ws/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
}

location / {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
