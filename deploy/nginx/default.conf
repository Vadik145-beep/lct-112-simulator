upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (PRD 14); repeated in the locations that add their own headers,
    # because add_header in a location replaces the inherited set.
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://backend/api/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SIP over WebSocket of the browser softphone → Asterisk (profile telephony). The name is
    # resolved at request time so nginx starts without the profile too.
    location = /ws/sip {
        resolver 127.0.0.11 valid=10s;
        set $asterisk http://asterisk:8088;
        proxy_pass $asterisk/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Hashed assets can be cached for a long time; index.html must not be.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
