upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # HTTP-01 challenges of Let's Encrypt for PUBLIC_HOST (profile cloud, plan/track-c-vapi.md).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The stand by its address or the names of TLS_HOSTS: the internal certificate. Security
# headers (PRD 14) are repeated in the locations that add their own headers, because
# add_header in a location replaces the inherited set (locations.conf).
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/locations.conf;
}

# public.conf: the same routes for PUBLIC_HOST with its Let's Encrypt certificate, written by
# the entrypoint when the certificate exists.
include /etc/nginx/conf.d/public/*.conf;
